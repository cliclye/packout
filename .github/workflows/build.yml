name: Build & Release Packout

on:
  push:
    branches: [ main, phone-integration ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Release files take their version from package.json, so make it match the tag (v1.2.3 -> 1.2.3).
      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Verify tracker against reference data
        run: node -e "require('./src/main/scout')"

      - name: Build installers
        run: npm run make

      - uses: actions/upload-artifact@v4
        with:
          name: Packout-${{ matrix.name }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.exe
            out/make/zip/**/*.zip
          retention-days: 30

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Unsigned on purpose: Apple only lets signed apps run on a phone, so users re-sign it with their
      # own free Apple ID (Sideloadly / AltStore) or build it in Xcode. See mobile/README.md.
      - name: Build Packout Coach (iPhone)
        shell: bash
        run: |
          VERSION="0.0.0"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          cd mobile/ios-coach
          xcodebuild -project PackoutCoach.xcodeproj -scheme PackoutCoach -sdk iphoneos -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" build
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/PackoutCoach.app ipa/Payload/
          (cd ipa && zip -qry "PackoutCoach-$VERSION-unsigned.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: Packout-Coach-iPhone
          path: mobile/ios-coach/ipa/*.ipa
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # tags like v1.2.0-phone are previews so they never replace the stable "latest" release
          prerelease: ${{ contains(github.ref_name, '-phone') }}
          files: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.zip
            dist/**/*.ipa
