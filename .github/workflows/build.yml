name: Build & Release Packout

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify tracker against reference data
        run: node -e "require('./src/main/scout')"

      - name: Build installers
        run: npm run make

      - uses: actions/upload-artifact@v4
        with:
          name: Packout-${{ matrix.name }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.exe
            out/make/zip/**/*.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.zip
